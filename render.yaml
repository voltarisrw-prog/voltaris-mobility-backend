services:
  - type: web
    name: voltaris-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: MONGODB_DATABASE
        value: voltaris

      # Frontend (Vercel) and API (Render) are cross-site.
      # Browser authentication cookies therefore require SameSite=None.
      - key: SESSION_COOKIE_SAMESITE
        value: none

      # One worker for Render free tier.
      - key: WEB_CONCURRENCY
        value: "1"

      # Secrets
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true

      # Authenticated browser requests require credentials.
      - key: CORS_ORIGINS
        value: '["https://voltaris-mobility-frontend.vercel.app","https://voltaris.rw"]'

      # Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: R2_BUCKET
        sync: false

      - key: R2_PUBLIC_BASE_URL
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false

      # Optional monitoring
      - key: SENTRY_DSN
        sync: false
