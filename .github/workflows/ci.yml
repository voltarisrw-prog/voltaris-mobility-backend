name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app || true   # advisory until the codebase is fully annotated
      - run: pytest tests/unit tests/api tests/security -q
      # scripts/smoke.py is a deploy gate, so it must not be the one thing that
      # is never tested. This runs its check list against the app in-process.
      - run: pytest tests/api/test_smoke_checks.py -q

  integration:
    name: Database integration (real MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # These are the tests that prove unique indexes, partial indexes, and the
      # concurrency guarantee. They are skipped locally and MUST run here.
      - run: pytest tests/integration -q
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Audits the RUNTIME set — a CVE in a lint tool does not ship to production.
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit --strict
      - name: Static security analysis
        run: |
          pip install bandit
          bandit -r app -ll
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality, integration, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: voltaris-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fail if the image runs as root
        run: |
          user=$(docker run --rm --entrypoint id voltaris-api:${{ github.sha }} -u)
          test "$user" != "0" || (echo "image runs as root" && exit 1)

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to staging. See DEPLOYMENT.md."
      - name: Smoke test the deployment
        run: |
          pip install -r requirements-dev.txt
          python scripts/smoke.py "${{ vars.STAGING_URL }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    # Manual approval configured on the GitHub environment. Nothing reaches
    # production from a laptop.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploy to production, then poll /readyz. See DEPLOYMENT.md."
